# Se fusiona con nav2_bringup/params/nav2_params.yaml de ROS 2 Humble.
# Ajustes del TurtleBot en Gazebo.
amcl:
  ros__parameters:
    alpha1: 0.01
    alpha2: 0.01
    alpha3: 0.01
    alpha4: 0.01
    alpha5: 0.01
    update_min_d: 0.05
    update_min_a: 0.05
    laser_max_range: 3.5
controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.15
    FollowPath:
      debug_trajectory_details: false
      max_vel_x: 0.22
      max_speed_xy: 0.22
      max_vel_theta: 0.65
      acc_lim_x: 0.3
      decel_lim_x: -0.3
      acc_lim_theta: 1.2
      decel_lim_theta: -1.2
      trans_stopped_velocity: 0.02
      xy_goal_tolerance: 0.12
      vy_samples: 1
local_costmap:
  local_costmap:
    ros__parameters:
      robot_radius: 0.23
      inflation_layer:
        inflation_radius: 0.45
global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.23
      inflation_layer:
        inflation_radius: 0.45
planner_server:
  ros__parameters:
    GridBased:
      tolerance: 0.12
      use_astar: true
behavior_server:
  ros__parameters:
    max_rotational_vel: 0.65
    min_rotational_vel: 0.18
    rotational_acc_lim: 1.2
velocity_smoother:
  ros__parameters:
    max_velocity: [0.22, 0.0, 0.65]
    min_velocity: [-0.22, 0.0, -0.65]
    max_accel: [0.3, 0.0, 1.2]
    max_decel: [-0.3, 0.0, -1.2]
    velocity_timeout: 0.5
